<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0514" />
    <meta
      name="description"
      content="Personal tarot and Vedic astrology readings. Speak directly with the Crystals Chakra studio on WhatsApp or by phone, and explore the crystal collection."
    />

    <title>Crystals Chakra — Unlock Your Destiny</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div
      id="intro"
      class="intro"
      role="dialog"
      aria-modal="true"
      aria-labelledby="intro-enter"
      aria-describedby="intro-hint"
      hidden
    >
      <canvas aria-hidden="true"></canvas>
      <div class="intro-content">
        <p class="intro-brand">
          <img src="/favicon.svg" alt="" width="40" height="40" />
          Crystals Chakra
        </p>
        <button type="button" id="intro-enter" class="intro-enter">
          <span class="intro-line">Step into</span>
          <em class="intro-line">your stars.</em>
          <span class="sr-only"> Enter Crystals Chakra</span>
        </button>
        <p id="intro-hint" class="intro-hint">
          Tap the words or scroll to enter
          <span class="intro-chevron" aria-hidden="true"></span>
        </p>
      </div>
    </div>
    <script src="/intro.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
