<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0514" />
    <meta
      name="description"
      content="Personal tarot and Vedic astrology readings. Speak directly with the Crystals Chakra studio on WhatsApp or by phone, and explore the crystal collection."
    />

    <title>Crystals Chakra — Unlock Your Destiny</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div
      id="intro"
      class="intro"
      role="dialog"
      aria-modal="true"
      aria-labelledby="intro-title"
      aria-describedby="intro-hint"
      hidden
    >
      <canvas aria-hidden="true"></canvas>
      <div class="intro-content">
        <p class="intro-brand">
          <img src="/favicon.svg" alt="" width="40" height="40" />
          Crystals Chakra
        </p>
        <p id="intro-title" class="intro-title">Unlock Your <em>Destiny</em></p>
        <button
          type="button"
          class="intro-card"
          aria-label="Draw your card and enter Crystals Chakra"
        >
          <span class="intro-card-inner" aria-hidden="true">
            <span class="intro-card-face intro-card-back">
              <svg viewBox="0 0 120 180">
                <rect x="6" y="6" width="108" height="168" rx="6" />
                <rect x="13" y="13" width="94" height="154" rx="4" />
                <circle cx="60" cy="90" r="27" />
                <circle cx="60" cy="90" r="17" />
                <path
                  d="M60 52v-14M60 142v-14M22 90h14M98 90h-14M33 63l9 9M87 117l-9-9M87 63l-9 9M33 117l9-9"
                />
                <path
                  class="fill"
                  d="M60 80l3.6 6.4L70 90l-6.4 3.6L60 100l-3.6-6.4L50 90l6.4-3.6z"
                />
              </svg>
            </span>
            <span class="intro-card-face intro-card-front">
              <svg viewBox="0 0 120 180">
                <rect x="6" y="6" width="108" height="168" rx="6" />
                <path
                  class="fill"
                  d="M60 46l7.6 22.4L90 70l-18 14.4L78.4 108 60 94.6 41.6 108 48 84.4 30 70l22.4-1.6z"
                />
                <circle class="fill" cx="30" cy="40" r="2" />
                <circle class="fill" cx="92" cy="34" r="2.6" />
                <circle class="fill" cx="96" cy="124" r="1.8" />
                <circle class="fill" cx="24" cy="118" r="2.2" />
              </svg>
              <span class="intro-card-name">The Star</span>
            </span>
          </span>
        </button>
        <p id="intro-hint" class="intro-hint">Tap the card to enter</p>
      </div>
      <button type="button" class="intro-skip">Skip intro</button>
    </div>
    <script src="/intro.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
