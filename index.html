<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0514" />
    <meta
      name="description"
      content="Personal tarot and Vedic astrology readings. Speak directly with the Crystals Chakra studio on WhatsApp or by phone, and explore the crystal collection."

      class="intro"

      aria-modal="true"

          type="button"
          class="intro-enter"
          aria-label="A little clarity begins here. Enter Crystals Chakra"
        >

          <em>begins here.</em>
        </button>
        <p id="intro-hint" class="intro-hint">
          Tap these words or scroll to begin
        </p>
        <span class="intro-scroll-mark" aria-hidden="true">↓</span>
      </div>
    </div>
    <script src="/intro.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
